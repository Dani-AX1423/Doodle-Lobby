# DoodleLobby Server Application Properties
# Cloud platform provided PORT with fallback
server.port=${PORT:5000}
socket.port=${SOCKET_PORT:${server.port}}

# Room access password - shared secret for room access
room.secret-password=${ROOM_SECRET_PASSWORD:doodlelobby-secret}

# Room auto-destruction settings (seconds before destroying empty room)
room.idle-timeout-seconds=${ROOM_IDLE_TIMEOUT:120}